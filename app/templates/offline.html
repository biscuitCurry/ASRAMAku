{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17306a">
    <title>Offline | ASRAMAku</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center; padding: 24px;
            background: #f4f6fb;
            color: #13213f; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .card {
            position: relative; overflow: hidden;
            width: min(100%, 440px); padding: 36px 28px 30px; text-align: center;
            background: #fff; border: 1px solid #e2e8f2; border-radius: 22px;
            box-shadow: 0 24px 64px rgba(23, 48, 106, 0.16);
        }
        .card::before {
            content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px;
            background: linear-gradient(90deg, #17306a 0 62%, #1d4b8f 62% 82%, #d0232b 82% 100%);
        }
        .card img { width: min(78%, 280px); height: auto; margin-bottom: 18px; }
        .icon {
            width: 58px; height: 58px; margin: 0 auto 14px; border-radius: 18px;
            display: grid; place-items: center; background: #fdecec; color: #d0232b;
        }
        h1 { margin: 0 0 8px; font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; color: #17306a; }
        p { margin: 0 0 22px; color: #56637a; line-height: 1.6; }
        button {
            border: 0; border-radius: 13px; padding: 13px 26px; cursor: pointer;
            background: #17306a; color: #fff;
            font: inherit; font-weight: 700; box-shadow: 0 10px 22px rgba(23, 48, 106, 0.24);
        }
        button:hover { background: #1d4b8f; }
        .status { margin: 16px 0 0; font-size: 0.85rem; }
    </style>
</head>
<body>
    <main class="card">
        <img src="{% static 'app/img/asramaku_logo_wide.png' %}" alt="ASRAMAku">
        <div class="icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/><path d="M3 3l18 18"/></svg>
        </div>
        <h1>You're offline</h1>
        <p>ASRAMAku needs an internet connection to load student records and requests. Check your Wi-Fi or mobile data, then try again.</p>
        <button type="button" id="retryBtn">Try again</button>
        <p class="status" id="status" role="status"></p>
    </main>

    <script>
        var statusEl = document.getElementById('status');
        function retry() {
            statusEl.textContent = 'Checking connection...';
            window.location.reload();
        }
        document.getElementById('retryBtn').addEventListener('click', retry);
        // Reload on its own as soon as the connection comes back
        window.addEventListener('online', retry);
    </script>
</body>
</html>
