<!DOCTYPE html>
{% load static %}
<html lang="en" class="notranslate" translate="no">
{% load pwa %}
    <head>
    {% progressive_web_app_meta %}
    <link rel="manifest" href="{% static 'manifest.json' %}">

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta http-equive="x-ua-compatible" content="ie=edge">
        <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js" integrity="sha512-HvOjJrdwNpDbkGJIG2ZNqDlVqMo77qbs4Me4cah0HoDrfhrbA+8SBlZn1KrvAQw7cILLPFJvdwIgphzQmMm+Pw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js" integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        <link rel="stylesheet" href="{% static 'app/css/style.css' %}">
        <title>ASRAMAku</title>
    </head>
    <body>
        <!-- Header Include -->
        {% include "app/semantics/header.html" %}

        <!-- Main Content -->
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>

        <!-- Footer Include -->
        {% include "app/semantics/footer.html" %}

        <!-- Bootstrap Bundle JS or other vendors -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Global Layout Logic Links -->
        {% load static %}
        <script src="{% static 'app/js/base.js' %}"></script>

        <!-- Page Specific Script Blocks -->
        {% block scripts %}{% endblock %}

        <script>
            function logoutOnClose() {
                try {
                    const logoutUrl = '/logout/?close=1';
                    if (navigator.sendBeacon) {
                        navigator.sendBeacon(logoutUrl, '');
                    } else {
                        fetch(logoutUrl, {
                            method: 'GET',
                            credentials: 'same-origin',
                            keepalive: true,
                        }).catch(() => {});
                    }
                } catch (error) {
                    console.warn('Close logout request failed:', error);
                }
            }

            window.addEventListener('beforeunload', logoutOnClose);
            window.addEventListener('pagehide', logoutOnClose);
        </script>

    </body>
</html>
